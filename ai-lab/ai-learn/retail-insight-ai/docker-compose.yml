services:
  backend:
    build:
      context: ./backend
    depends_on:
      - postgres
    environment:
      APP_ENV: local
      LOG_LEVEL: INFO
      SERVICE_NAME: retail-insight-ai
      TASK_EXECUTION_MODE: background
      RESEARCH_PROVIDER: static
      DATA_PROVIDER: static
      REPOSITORY_BACKEND: inmemory
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: retail_insight_ai
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      CORS_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
      WORKFLOW_STEP_DELAY_SECONDS: "0.05"
      STATIC_RESEARCH_FAIL: "false"
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_insight_ai
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres_data:

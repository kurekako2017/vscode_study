# ERIP 企业运行 Compose（默认 Stub LLM，不产生外部 API 费用）
# 启动：./scripts/compose_up.sh
# 停止：./scripts/compose_down.sh  （禁止 -v，保留 volume）

name: erip

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erip}
      POSTGRES_USER: ${POSTGRES_USER:-erip_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erip_change_me_local_only}
      TZ: UTC
      LANG: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: retail-insight-ai
      REPOSITORY_BACKEND: postgres
      LLM_PROVIDER_MODE: stub
      LLM_PROVIDER: stub
      RUN_REAL_LLM_SMOKE: "0"
      RUN_OPENROUTER_SMOKE: "0"
      RUN_NVIDIA_SMOKE: "0"
      RUN_GEMINI_SMOKE: "0"
      RUN_LOCAL_QWEN_SMOKE: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-erip}
      POSTGRES_USER: ${POSTGRES_USER:-erip_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erip_change_me_local_only}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erip_app}:${POSTGRES_PASSWORD:-erip_change_me_local_only}@postgres:5432/${POSTGRES_DB:-erip}
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080","http://127.0.0.1:5173","http://localhost:5173"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-erip-local-jwt-signing-key-change-before-deployment-2026}
      LEARNING_TRACE: "false"
      TASK_EXECUTION_MODE: background
      RESEARCH_PROVIDER: static
      DATA_PROVIDER: static
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

volumes:
  erip_postgres_data:
    name: erip_postgres_data
